name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get install -y g++ make cmake curl

      - name: Build load balancer (Makefile)
        working-directory: load-balancer
        run: make

      - name: Run unit tests (Makefile)
        working-directory: load-balancer
        run: make test

      - name: Build echo server
        working-directory: server
        run: make

      - name: Integration tests
        run: |
          chmod +x scripts/test.sh
          bash scripts/test.sh

      - name: Build & test with CMake
        run: |
          cmake -S load-balancer -B build
          cmake --build build
          cd build && ctest --output-on-failure
