# nginx site for the load balancer on EC2.
#
# Install:
#   sudo cp scripts/nginx-lb-backend.conf /etc/nginx/sites-available/lb-backend
#   sudo ln -sf /etc/nginx/sites-available/lb-backend /etc/nginx/sites-enabled/lb-backend
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d lb-backend.naman.sbs -d lb-backend.namankundra.com
#
# Only 80/443 need to be open in the security group; 8080/8081 stay private.
server {
    listen 80;
    server_name lb-backend.naman.sbs lb-backend.namankundra.com;

    location /stats {
        proxy_pass http://127.0.0.1:8081/stats;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
