# Load balancer configuration
# CLI flags override these values when both are provided.

port     = 8080
backends = 8001, 8002, 8003

# Optional: relative weights per backend (same order as backends).
# Omit to give all backends equal weight.
# weights = 2, 1, 1

# Algorithm: lc (least-connections) | rr (round-robin) | ih (ip-hash)
algo     = lc

# Worker thread pool size
threads  = 16

# Max concurrent connections per backend; 0 = unlimited.
# max_conn = 100
